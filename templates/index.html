<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .result-container {
            display: none;
            margin-top: 20px;
        }
        .severity-0 { color: green; }
        .severity-1 { color: #ffc107; }
        .severity-2 { color: #fd7e14; }
        .severity-3 { color: #dc3545; }
        .severity-4 { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Heart Disease Prediction</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="form-container">
                    <form id="predictionForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="age" name="age" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="gender" class="form-label">Gender (0: Female, 1: Male)</label>
                                <select class="form-select" id="gender" name="gender" required>
                                    <option value="0">Female</option>
                                    <option value="1">Male</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="chest_pain" class="form-label">Chest Pain Type (0-3)</label>
                                <input type="number" class="form-control" id="chest_pain" name="chest_pain" min="0" max="3" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="resting_bp" class="form-label">Resting Blood Pressure</label>
                                <input type="number" class="form-control" id="resting_bp" name="resting_bp" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cholesterol" class="form-label">Cholesterol</label>
                                <input type="number" class="form-control" id="cholesterol" name="cholesterol" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fasting_bs" class="form-label">Fasting Blood Sugar (0: ≤ 120 mg/dl, 1: > 120 mg/dl)</label>
                                <select class="form-select" id="fasting_bs" name="fasting_bs" required>
                                    <option value="0">≤ 120 mg/dl</option>
                                    <option value="1">> 120 mg/dl</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="rest_ecg" class="form-label">Resting ECG (0-2)</label>
                                <input type="number" class="form-control" id="rest_ecg" name="rest_ecg" min="0" max="2" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="max_hr" class="form-label">Maximum Heart Rate</label>
                                <input type="number" class="form-control" id="max_hr" name="max_hr" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="exercise_angina" class="form-label">Exercise Angina (0: No, 1: Yes)</label>
                                <select class="form-select" id="exercise_angina" name="exercise_angina" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="oldpeak" class="form-label">Oldpeak</label>
                                <input type="number" step="0.1" class="form-control" id="oldpeak" name="oldpeak" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="slope" class="form-label">Slope (0-2)</label>
                                <input type="number" class="form-control" id="slope" name="slope" min="0" max="2" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="ca" class="form-label">CA (0-3)</label>
                                <input type="number" class="form-control" id="ca" name="ca" min="0" max="3" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="thal" class="form-label">Thal (0-3)</label>
                            <input type="number" class="form-control" id="thal" name="thal" min="0" max="3" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Predict</button>
                    </form>
                </div>

                <div class="result-container" id="resultContainer">
                    <div class="card mt-4">
                        <div class="card-body">
                            <h5 class="card-title">Prediction Result</h5>
                            <p class="card-text" id="predictionStatement"></p>
                            <p class="card-text">Confidence: <span id="confidence"></span>%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const formData = new FormData(e.target);
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.error) {
                    alert(result.error);
                    return;
                }

                const resultContainer = document.getElementById('resultContainer');
                const predictionStatement = document.getElementById('predictionStatement');
                const confidence = document.getElementById('confidence');

                resultContainer.style.display = 'block';
                predictionStatement.textContent = result.statement;
                predictionStatement.className = `card-text severity-${result.prediction}`;
                confidence.textContent = (result.probability * 100).toFixed(2);

            } catch (error) {
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>
